name: resina-bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resina-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          UMBRAL: "180"
        run: python resina_bot.py

      - name: Guardar estado
        run: |
          git config user.name "resina-bot"
          git config user.email "resina-bot@users.noreply.github.com"
          git add estado.json
          git diff --staged --quiet || (git commit -m "actualizar estado" && git push)
